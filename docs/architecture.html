  @media print {
    body { background:#fff; padding:0; }

    .toolbar { margin-bottom:8px; }
  }
</style>

<!-- ===================== flow summary ===================== -->
<rect x="22" y="700" width="512" height="340" rx="11"
      fill="#f3f8fd" stroke="#0972d3" stroke-width="1.8"/>
<text class="t-head" x="44" y="729">Request flow</text>

<text class="t-num"  x="44" y="757">1.</text>
<text class="t-item" x="66" y="757">Browser loads the SPA from CloudFront (origin: S3).</text>
<text class="t-num"  x="44" y="783">2.</text>
<text class="t-item" x="66" y="783">User signs in via Cognito managed login (PKCE).</text>
<text class="t-num"  x="44" y="809">3.</text>
<text class="t-item" x="66" y="809">SPA calls /tickets with the ID token attached.</text>
<text class="t-num"  x="44" y="835">4.</text>
<text class="t-item" x="66" y="835">API Gateway validates the JWT with the authorizer.</text>
<text class="t-num"  x="44" y="861">5.</text>
<text class="t-item" x="66" y="861">Handler Lambda runs behind proxy integration.</text>
<text class="t-num"  x="44" y="887">6.</text>
<text class="t-item" x="66" y="887">Bedrock returns category, priority, team, steps.</text>
<text class="t-num"  x="44" y="913">7.</text>
<text class="t-item" x="66" y="913">Ticket is written to DynamoDB.</text>
<text class="t-num"  x="44" y="939">8.</text>
<text class="t-item" x="66" y="939">The stream fires the notifier Lambda on INSERT.</text>
<text class="t-num"  x="44" y="965">9.</text>
<text class="t-item" x="66" y="965">Notifier publishes to the assigned team's topic.</text>
<text class="t-num"  x="44" y="991">10.</text>
<text class="t-item" x="72" y="991">SNS emails the team; SES is the verified sender.</text>

<text class="t-sub"  x="44" y="1021">GET /tickets additionally requires the it-staff group.</text>
